# Development override. Layer it on top of the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# It swaps the web/realtime services to their *.dev images, bind-mounts the
# source for hot reload, and enables file-watch polling (required on Windows,
# where bind-mounted filesystems do not emit inotify events so saves would
# otherwise go unnoticed). The db service is inherited unchanged from the base.
# With COMPOSE_PROFILES=mailpit in .env, Mailpit runs too and catches all outgoing
# email instead of delivering it: browse it at http://localhost:8025. Without it,
# email uses the SMTP_* settings in .env, like production; without SMTP_HOST either,
# the web container prints each email (including generated passwords) to its log.
services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Watch via polling instead of inotify (Windows bind mount).
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      APP_URL: "http://localhost:3000"
    depends_on:
      mailpit:
        condition: service_started
        # Only there when COMPOSE_PROFILES=mailpit.
        required: false
    volumes:
      # Live source from the host...
      - .:/app
      # ...but keep the container's own node_modules and .next so the Linux
      # builds aren't clobbered by the Windows host's copies.
      - /app/node_modules
      - /app/.next

  realtime:
    build:
      context: .
      dockerfile: ./realtime/Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules

  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketing-mailpit
    profiles:
      - mailpit
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP
